{% extends "admin_base.html" %}
{% block content %}
  <div class="card" style="max-width: 460px;">
    <h1 class="headline-lg" style="margin:0 0 .5rem 0;">Staff login</h1>
    <p class="muted" style="margin:0 0 1rem 0;">Sign in with the username and password your editor gave you.</p>

    <form class="admin-form" method="post" action="/admin/login">
      <input type="hidden" name="csrf" value="{{ csrf }}" />
      <input type="hidden" name="next" value="{{ next }}" />

      <label class="field">
        <span class="field-label">Username</span>
        <input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" />
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" required autocomplete="current-password" />
      </label>

      <div style="display:flex; gap:.6rem; flex-wrap:wrap; align-items:center;">
        <button class="btn" type="submit">Log in</button>
      </div>

      <p class="help" style="margin:0;">
        Forgot your password? Ask an admin to reset it. The adviser can always sign in as <code>admin</code>
        with the password set in <code>HAFS_ADMIN_PASSWORD</code> on Railway.
      </p>
    </form>
  </div>
{% endblock %}
